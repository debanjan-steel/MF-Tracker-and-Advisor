name: 24/7 Autonomous Nightly Market & Mutual Fund Sync

on:
  schedule:
    # 9:30 PM IST daily = 16:00 UTC (Mon-Fri market closing sync)
    - cron: '0 16 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  nightly-sync:
    name: Execute Daily Data Ingestion & Analytics Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Nightly Sync & Learning Cycle
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          DEFAULT_WHATSAPP_TO: ${{ secrets.DEFAULT_WHATSAPP_TO }}
        run: |
          python scripts/nightly_sync.py

      - name: Commit & Push Updated Local Data (if not using cloud DB)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Cloud Worker"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): automated nightly NAV & macro sync [skip ci]" && git push)

